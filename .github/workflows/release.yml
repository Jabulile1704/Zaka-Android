name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The same two jobs CI runs, by calling them rather than copying them.
  # A release that skipped the tests would be the point at which the tests
  # stopped meaning anything.
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest

    env:
      ZAKA_KEYSTORE_BASE64: ${{ secrets.ZAKA_KEYSTORE_BASE64 }}
      ZAKA_KEYSTORE_PASSWORD: ${{ secrets.ZAKA_KEYSTORE_PASSWORD }}
      ZAKA_KEY_ALIAS: ${{ secrets.ZAKA_KEY_ALIAS }}
      ZAKA_KEY_PASSWORD: ${{ secrets.ZAKA_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.1 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6

      # Before anything is built. A tag that disagrees with the app's own
      # version is the mistake worth catching first, because every artefact
      # after it would carry the wrong number.
      - name: Check the tag against the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(./gradlew -q :app:printVersionName | tail -1 | tr -d '[:space:]')"
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag  versionName=$version"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version."
            echo "Bump versionName in app/build.gradle.kts, or tag v$version."
            exit 1
          fi

      # Absent the secret the build simply produces an unsigned bundle, which
      # is still worth having: it proves the release variant assembles.
      - name: Decode the upload key
        if: env.ZAKA_KEYSTORE_BASE64 != ''
        run: |
          echo "$ZAKA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ZAKA_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build the App Bundle and the APK
        run: ./gradlew :app:bundleRelease :app:assembleRelease

      - name: Say whether it was signed
        run: |
          if [ -n "${ZAKA_KEYSTORE:-}" ]; then
            echo "Signed with the upload key."
          else
            echo "::warning::No signing secrets configured — these artefacts are UNSIGNED and cannot be uploaded to Play."
          fi

      - name: Keep the artefacts
        uses: actions/upload-artifact@v7
        with:
          name: zaka-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: error

      # Notes come from the merged pull requests since the last tag, which is
      # why every change goes through one.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Zaka $GITHUB_REF_NAME" \
            --generate-notes \
            app/build/outputs/bundle/release/*.aab \
            app/build/outputs/apk/release/*.apk
