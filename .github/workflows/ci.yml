name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # So the release workflow can run these same checks by calling them,
  # rather than copying the jobs and letting the copies drift.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  logic:
    name: Logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Print the toolchain
        run: |
          java -version
          ./gradlew --version

      # The pure logic is a plain JVM module, so this needs no Android SDK and
      # no emulator. It is the suite that says whether a port is faithful.
      - name: Test the ported logic
        run: ./gradlew :core:test

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logic-test-report
          path: core/build/reports/tests/test
          retention-days: 7

  app:
    name: App build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Pinned rather than left to the runner image: the app compiles against
      # API 37.1, and a platform the image happens not to ship would fail for
      # want of an SDK rather than for anything wrong with the code.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.1 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the app and run its unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

      # R8 only runs on release, so a debug-only pipeline would not notice a
      # shrinking or keep-rule problem until the day of a release.
      - name: Build the release variant through R8
        run: ./gradlew :app:assembleRelease

      - name: Keep the reports when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-build-reports
          path: |
            app/build/reports
            app/build/outputs/logs
          retention-days: 7

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.1 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6

      # Lint has little to say about Compose semantics - its accessibility
      # checks are written for Views - so this is the belt and the semantics
      # tests in the unit suite are the braces.
      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Keep the lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt
          retention-days: 7

  instrumented:
    name: Instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.1 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6

      # Without this the emulator falls back to software rendering and the
      # job takes long enough to be worth nobody's time.
      - name: Let the runner use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The suite is deliberately thin: it asserts the app starts and that
      # Room opens its file on a real Android runtime. That is the half the
      # unit suites cannot reach, and the half that breaks on a device.
      - name: Run them on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-report
          path: app/build/reports/androidTests
          retention-days: 7
