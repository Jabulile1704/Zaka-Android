name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  logic:
    name: Logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Print the toolchain
        run: |
          java -version
          ./gradlew --version

      # The pure logic is a plain JVM module, so this needs no Android SDK and
      # no emulator. It is the suite that says whether a port is faithful.
      - name: Test the ported logic
        run: ./gradlew :core:test

      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logic-test-report
          path: core/build/reports/tests/test
          retention-days: 7

  app:
    name: App build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Pinned rather than left to the runner image: the app compiles against
      # API 37.1, and a platform the image happens not to ship would fail for
      # want of an SDK rather than for anything wrong with the code.
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-37.1 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the app and run its unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

      # R8 only runs on release, so a debug-only pipeline would not notice a
      # shrinking or keep-rule problem until the day of a release.
      - name: Build the release variant through R8
        run: ./gradlew :app:assembleRelease

      - name: Keep the reports when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-build-reports
          path: |
            app/build/reports
            app/build/outputs/logs
          retention-days: 7
