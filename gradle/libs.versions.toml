[versions]
agp = "9.5.2"
kotlin = "2.4.21"
composeBom = "2026.11.01"
coreKtx = "1.19.1"
splashscreen = "1.2.0"
lifecycle = "2.11.1"
activityCompose = "1.13.0"
junit = "4.13.2"
ksp = "2.3.14"
room = "2.8.5"
robolectric = "4.18.1"
androidxTestCore = "1.7.0"
coroutines = "1.11.0"
